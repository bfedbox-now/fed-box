<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Home</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #000;
        font-family: Arial, sans-serif;
      }

      /* --- Navigation bar --- */
      nav {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        background-color: rgba(0, 0, 0, 0.85);
        display: flex;
        justify-content: center;
        gap: 40px;
        padding: 15px 0;
        z-index: 10;
      }

      nav a {
        color: white;
        text-decoration: none;
        font-size: 1.1em;
        font-weight: bold;
        transition: color 0.3s;
      }

      nav a:hover {
        color: #ffcc00;
      }

      /* --- Full image below navbar --- */
      .photo-container {
        display: flex;
        justify-content: center;
        align-items: center;
        height: calc(100vh - 60px); /* full screen minus navbar */
        margin-top: 60px;
      }

      img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
    </style>
  </head>
  <body>
    <nav>
      <a href="weare.html">We Are</a>
      <a href="constitution.html">Constitution</a>
    </nav>

    <div class="photo-container">
      <img src="Website.png" alt="Main photo">
    </div>
  </body>
</html>
